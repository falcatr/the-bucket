<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#03158f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ASCII Ocean</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="app" class="app-shell">
      <canvas id="ocean" class="ocean-canvas" aria-label="Oceano procedural feito com caracteres"></canvas>
      <canvas
        id="interactionLayer"
        class="interaction-canvas"
        aria-label="Camada de interação com balde ASCII. Puxe de cima para baixo; o mar desce para revelar a região acima e só atualiza ao soltar após o limite."
      ></canvas>

      <div class="top-actions" aria-label="Controles da aplicação">
        <button id="fullscreenToggle" class="icon-button" type="button" aria-label="Entrar em tela cheia" title="Tela cheia">⛶</button>
        <button id="debugToggle" class="icon-button" type="button" aria-controls="debugPanel" aria-expanded="true" aria-label="Fechar painel de debug" title="Configurações">×</button>
      </div>

      <aside id="debugPanel" class="debug-panel" aria-label="Painel de configuração procedural">
        <div class="debug-panel__header">
          <span class="debug-panel__title">OCEAN DEBUG</span>
          <span class="debug-panel__status">LIVE</span>
        </div>
        <div id="debugControls" class="debug-controls"></div>
        <div class="debug-panel__footer">
          <button class="debug-button debug-button--secondary" id="refreshView" type="button">ATUALIZAR</button>
          <button class="debug-button" id="newVariation" type="button">NOVA VARIAÇÃO</button>
        </div>
      </aside>

      <section class="rotate-notice" aria-live="polite">
        <div class="rotate-notice__icon">↻</div>
        <strong>Modo retrato</strong>
        <span>Gire o dispositivo para continuar.</span>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
