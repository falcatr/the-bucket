<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#03158f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="the bucket" />
    <meta name="apple-mobile-web-app-title" content="the bucket" />
    <meta
      name="description"
      content="&gt;fill your bucket &gt;drop it &gt;grab what you can &gt;repeat"
    />
    <meta property="og:title" content="the bucket" />
    <meta
      property="og:description"
      content="&gt;fill your bucket &gt;drop it &gt;grab what you can &gt;repeat"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="the bucket" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="./icon-600.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="the bucket" />
    <meta
      name="twitter:description"
      content="&gt;fill your bucket &gt;drop it &gt;grab what you can &gt;repeat"
    />
    <meta name="twitter:image" content="./icon-600.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <title>the bucket</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="app" class="app-shell">
      <canvas id="ocean" class="ocean-canvas" aria-label="Oceano procedural feito com caracteres"></canvas>
      <canvas
        id="aquariumLayer"
        class="aquarium-canvas"
        aria-label="Camada aquário com palavras emocionais persistentes"
      ></canvas>
      <canvas
        id="interactionLayer"
        class="interaction-canvas"
        aria-label="Camada de interação com balde ASCII. Puxe de cima para baixo para revelar a continuação da água acima da viewport."
      ></canvas>
      <canvas
        id="hudLayer"
        class="hud-canvas"
        aria-label="HUD fixo com Attention e Apetite"
      ></canvas>
      <canvas
        id="entropyLayer"
        class="entropy-canvas"
        aria-label="Camada visual de Entropy e glitch progressivo"
      ></canvas>

      <div
        id="entityOverlay"
        class="entity-overlay"
        hidden
        role="presentation"
      >
        <section
          class="entity-terminal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="entityTitle"
          aria-describedby="entityMessage"
          tabindex="-1"
        >
          <div
            id="entityTitle"
            class="entity-terminal__title"
          >c:\entity</div>
          <p
            id="entityMessage"
            class="entity-terminal__message"
          >Congratulations! You became a channel through which now communicative capitalism circulates and proliferates.</p>
        </section>
      </div>

      <canvas
        id="meltdownLayer"
        class="meltdown-canvas"
        hidden
        aria-label="Animação final eterna de meltdown tipográfico"
      ></canvas>

      <div class="top-actions" aria-label="Application controls">
        <button id="fullscreenToggle" class="icon-button" type="button" aria-label="Entrar em tela cheia" title="Tela cheia">⛶</button>
      </div>

      <section class="rotate-notice" aria-live="polite">
        <div class="rotate-notice__icon">↻</div>
        <strong>Modo retrato</strong>
        <span>Gire o dispositivo para continuar.</span>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
